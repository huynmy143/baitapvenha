<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 8.1 - Enabling/Disabling JavaScript</title>
</head>
<body>
    <h1>Exercise 8.1: Testing JavaScript Status</h1>
    <script type="text/javascript">
        document.write("<p style='color: green; font-size: 18px; font-weight: bold;'>You have JavaScript enabled</p>");
    </script>
    <noscript>
        <p style="color: red; font-size: 18px; font-weight: bold;">You have JavaScript disabled</p>
    </noscript>
</body>
</html>
